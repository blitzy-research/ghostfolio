@if (src) {
  <!--
    `alt` is bound to the same text as `title` rather than left off. Without it
    this image relies on `title` alone for its name, which is a fallback rather
    than a label and disappears entirely when no tooltip is supplied. The empty
    string in that case is deliberate and correct: an unnamed logo beside a name
    that is already rendered is decoration, and `alt=""` says so, whereas a
    missing `alt` makes assistive technology announce the file path instead.
  -->
  <!--
    `(error)` replaces an inline `onerror` that hid the element in place, and
    `(load)` is its counterpart. The component needs to be told either way, not
    just the element: this image may be the single probe standing in for several
    rows that want the same logo, and they are waiting on both answers - one so
    they can show it, the other so they stop asking. See `logoAttempts`.
  -->
  <img
    [alt]="tooltip ? tooltip : ''"
    [ngClass]="{ large: size === 'large' }"
    [src]="src"
    [title]="tooltip ? tooltip : ''"
    (error)="onImageError()"
    (load)="onImageLoad()"
  />
}
