@if (deviceType === 'mobile') {
  <div class="d-flex justify-content-center" mat-dialog-actions>
    <button
      aria-label="Close the dialog"
      i18n-aria-label
      mat-button
      (click)="onClickCloseButton()"
    >
      <ion-icon aria-hidden="true" name="close" size="large" />
    </button>
  </div>
}
