<!--
  `id` and `aria-describedby` both belong on THIS element rather than on the host, and
  for the same reason: they are what `mat-form-field` points its label and its messages
  at, and only a labelable element - an input, select, textarea or button - can receive
  either. A custom element accepts both attributes silently and honours neither, which
  is how this field came to have no accessible name while still rendering a label that
  looked correct.
-->
<input
  autocapitalize="off"
  autocomplete="off"
  matInput
  [attr.aria-describedby]="describedBy || null"
  [formControl]="control"
  [id]="id"
  [matAutocomplete]="currencyAutocomplete"
/>

<mat-autocomplete
  #currencyAutocomplete="matAutocomplete"
  (optionSelected)="onUpdateCurrency($event)"
>
  @for (currency of filteredCurrencies; track currency) {
    <mat-option class="line-height-1" [value]="currency">
      {{ currency }}
    </mat-option>
  }
</mat-autocomplete>
