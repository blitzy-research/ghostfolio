<form [formGroup]="accountBalanceForm" (ngSubmit)="onSubmitAccountBalance()">
  <table
    class="gf-table w-100"
    mat-table
    matSort
    matSortActive="date"
    matSortDirection="desc"
    [dataSource]="dataSource"
  >
    <ng-container matColumnDef="date">
      <th
        *matHeaderCellDef
        class="px-2"
        mat-header-cell
        mat-sort-header
        scope="col"
      >
        <ng-container i18n>Date</ng-container>
      </th>
      <td *matCellDef="let element" class="px-2" mat-cell>
        <gf-value [isDate]="true" [locale]="locale()" [value]="element?.date" />
      </td>
      <td *matFooterCellDef class="px-2" mat-footer-cell>
        <mat-form-field appearance="outline" class="py-1 without-hint">
          <!--
            Named through `aria-label`, because this field has no `mat-label` and cannot
            reasonably be given one: it is the entry row of a table, and the column
            header above it is what tells a viewer what it holds. That header is not
            associated with the input though, so the field was announced as an unnamed
            edit box. The label matches the visible column header word for word, so the
            name a viewer hears is the name they read.
          -->
          <input
            aria-label="Date"
            formControlName="date"
            i18n-aria-label
            matInput
            [matDatepicker]="date"
          />
          <mat-datepicker-toggle matSuffix [for]="date">
            <ion-icon
              aria-hidden="true"
              class="text-muted"
              matDatepickerToggleIcon
              name="calendar-clear-outline"
            />
          </mat-datepicker-toggle>
          <mat-datepicker #date />
          <!--
            Says why "Add" is refusing. The date arrives pre-filled with today, so this
            is reached by clearing it - after which the control simply greyed out with
            the reason stated nowhere.
          -->
          @if (accountBalanceForm.get('date').hasError('required')) {
            <mat-error i18n>Please enter a date.</mat-error>
          }
        </mat-form-field>
      </td>
    </ng-container>

    <ng-container matColumnDef="value">
      <th *matHeaderCellDef class="px-2 text-right" mat-header-cell scope="col">
        <ng-container i18n>Value</ng-container>
      </th>
      <td *matCellDef="let element" class="px-2" mat-cell>
        <div class="d-flex justify-content-end">
          <gf-value
            [isCurrency]="true"
            [locale]="locale()"
            [unit]="element?.account?.currency"
            [value]="element?.value"
          />
        </div>
      </td>
      <td *matFooterCellDef class="px-2" mat-footer-cell>
        <div class="d-flex justify-content-end">
          <mat-form-field appearance="outline" class="without-hint">
            <!--
              Named through `aria-label` for the same reason as the date beside it: the
              column header is the only thing that says what this field is, and a header
              is not associated with an input.
            -->
            <input
              aria-label="Value"
              formControlName="balance"
              i18n-aria-label
              matInput
              type="number"
            />
            <div class="ml-2" matTextSuffix>
              {{ accountCurrency() }}
            </div>
            @if (accountBalanceForm.get('balance').hasError('required')) {
              <mat-error i18n>Please enter a value.</mat-error>
            }
          </mat-form-field>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions" stickyEnd>
      <th
        *matHeaderCellDef
        class="px-1 text-center"
        mat-header-cell
        scope="col"
      >
        <span class="sr-only" i18n>Actions</span>
      </th>
      <td *matCellDef="let element" class="px-1 text-center" mat-cell>
        @if (showActions()) {
          <button
            aria-label="Actions for this account balance"
            class="mx-1 no-min-width px-2"
            i18n-aria-label
            mat-button
            type="button"
            [matMenuTriggerFor]="accountBalanceMenu"
            (click)="$event.stopPropagation()"
          >
            <ion-icon aria-hidden="true" name="ellipsis-horizontal" />
          </button>
        }
        <mat-menu #accountBalanceMenu="matMenu" xPosition="before">
          <button
            mat-menu-item
            type="button"
            (click)="onDeleteAccountBalance(element.id)"
          >
            <span class="align-items-center d-flex">
              <ion-icon aria-hidden="true" class="mr-2" name="trash-outline" />
              <span i18n>Delete</span>
            </span>
          </button>
        </mat-menu>
      </td>
      <td *matFooterCellDef class="px-1 text-center" mat-footer-cell>
        <button
          class="mx-1 no-min-width px-2"
          color="primary"
          mat-flat-button
          type="submit"
          [disabled]="accountBalanceForm.invalid"
        >
          <span i18n>Add</span>
        </button>
      </td>
    </ng-container>

    <tr *matHeaderRowDef="displayedColumns; sticky: true" mat-header-row></tr>
    <tr *matRowDef="let row; columns: displayedColumns" mat-row></tr>
    <tr
      *matFooterRowDef="displayedColumns"
      mat-footer-row
      [hidden]="!showActions()"
    ></tr>
  </table>
</form>
