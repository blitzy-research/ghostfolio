@if (title) {
  <div class="gf-notification-text" mat-dialog-title>{{ title }}</div>
}

@if (message) {
  <div class="gf-notification-text" mat-dialog-content>{{ message }}</div>
}

<div align="end" mat-dialog-actions>
  <button mat-button (click)="dialogRef.close('discard')">
    {{ discardLabel }}
  </button>
  <button
    mat-flat-button
    [color]="confirmType"
    (click)="dialogRef.close('confirm')"
  >
    {{ confirmLabel }}
  </button>
</div>
