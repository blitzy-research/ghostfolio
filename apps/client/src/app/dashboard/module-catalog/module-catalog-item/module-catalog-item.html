<!--
  Use native draggable events because gridster listens for browser drag/drop
  events. `is-dragging` is the drag-active state hook the stylesheet paints, and
  it is cleared from dragend because a drag can also end in a cancel or an
  out-of-bounds drop, neither of which fires a drop event.

  The card is presentation; the button inside it is the actionable element. That
  split is deliberate: a `FocusKeyManager` focuses the option it moves to, so the
  option has to own something the browser can actually focus, and a real button
  is what announces the add command and activates on Enter and Space without any
  key handling of our own. The card cannot be that element - it renders a div -
  so the button carries the focus, the drag and the activation, and the card
  keeps drawing every state around it.

  The button is a Material button rather than a bare one, and that is a
  correctness fix rather than a flourish: an unstyled `button` paints the user
  agent's own control chrome - an opaque grey face, a 2 px outset border and
  square corners - straight over the card's tokenised surface, which both looks
  broken and violates the design-system rule that a library component is used
  wherever one exists. `matButton` resolves its own surface, shape, typography
  and state layer from Material's tokens, so the card supplies the container and
  the button supplies the control.
-->
<mat-card
  appearance="outlined"
  [class.is-dragging]="isDragging"
  [class.is-placed]="isPlaced"
  [class.is-unavailable]="isUnavailable"
>
  <!--
    The accessible name is composed in the class rather than declared here,
    because it interpolates the module name and Angular cannot localize a bound
    attribute - `i18n-aria-label` only applies to a static one.

    `tabindex` is bound rather than fixed at -1. The rows share ONE tab stop
    between them - the roving pattern the parent's key manager drives - and that
    pattern needs exactly one row reachable by Tab at a time. Fixing every row at
    -1 leaves no tab stop at all, which makes the whole result list unreachable
    from the keyboard: Tab goes from the search field straight past every module.

    It is bound as the `tabIndex` PROPERTY, not as `[attr.tabindex]`. That is the
    canonical form for this one attribute - Angular's own property-name mapping
    rewrites `tabindex` to `tabIndex` - and it is the form that takes effect here:
    the attribute binding sets nothing at all on this element, while the sibling
    `[attr.aria-label]` binds normally. The property also reflects back into the
    content attribute, so both the focus order the browser computes and the
    attribute assistive technology reads end up correct.
  -->
  <button
    #row
    class="align-items-center d-flex justify-content-start px-3 py-2 text-left w-100"
    draggable="true"
    matButton
    type="button"
    [attr.aria-disabled]="isUnavailable ? 'true' : null"
    [attr.aria-label]="ariaLabel"
    [tabIndex]="isTabbable ? 0 : -1"
    (blur)="removeFocus()"
    (click)="onClick()"
    (dragend)="onDragEnd()"
    (dragstart)="onDragStart($event)"
    (focus)="onFocus()"
  >
    <span class="text-truncate">{{ definition.name }}</span
    >&ngsp;
    <!--
      The qualifier that tells two modules sharing one name apart - `Markets` for
      both market modules, `Settings` for both settings modules - which they share
      because each name is the route registry's title for the screen it replaces,
      reused verbatim so every locale already translates it.

      Rendered as its own element rather than appended to the name above, because
      the name is the authoritative localized string and stays untouched. Hidden
      from assistive technology for the same reason the placed and unavailable
      markers are: the button's accessible name already carries the qualifier, and
      announcing it twice is noise.

      `&ngsp;` above is load-bearing. Angular strips whitespace between elements,
      so without it the name and the qualifier abut and the row's text reads
      `Markets· Market Data` - a gap drawn by padding would look right while
      anything reading the text, a copied selection included, would not. It is the
      compiler's own pseudo-entity for exactly this, and it survives whitespace
      removal as a real space.
    -->
    @if (definition.context) {
      <span aria-hidden="true" class="context-qualifier text-truncate"
        >· {{ definition.context }}</span
      >
    }

    <!--
      Tells the viewer this module is already on their canvas, so a row whose
      click reveals the existing module rather than adding a second one no longer
      looks identical to one that adds. Hidden from assistive technology because
      the button's own name already carries the same distinction - announcing it
      twice would be noise - and marked as decorative rather than removed from
      the flow so the visual and the spoken form stay in step.
    -->
    @if (isPlaced) {
      <span aria-hidden="true" class="ml-auto placed-marker pl-2" i18n
        >Added</span
      >
    } @else if (isUnavailable) {
      <!--
        Tells the viewer why this row will not add anything: the grid has no room
        left for this module's footprint. Chained to the placed marker rather than
        rendered independently so a row can never claim to be both, and hidden
        from assistive technology for the same reason the placed marker is - the
        button's own name already carries it, and saying it twice is noise.
      -->
      <span aria-hidden="true" class="ml-auto pl-2 unavailable-marker" i18n
        >No room</span
      >
    }
  </button>
</mat-card>
