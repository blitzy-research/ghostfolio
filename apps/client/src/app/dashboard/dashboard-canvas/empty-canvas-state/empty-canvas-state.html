<mat-card appearance="outlined">
  <div class="p-3">
    <div class="d-flex justify-content-center mb-1">
      <gf-logo size="large" [showLabel]="false" />
    </div>
    <div class="mb-1 text-center" i18n>Your dashboard is empty.</div>
    <div class="mb-3 secondary-text text-center" i18n>
      Add modules from the catalog to build your dashboard.
    </div>
    <div class="d-flex justify-content-center">
      <button color="primary" mat-button (click)="openCatalog.emit()">
        <span i18n>Browse modules</span>
      </button>
    </div>
  </div>
</mat-card>
