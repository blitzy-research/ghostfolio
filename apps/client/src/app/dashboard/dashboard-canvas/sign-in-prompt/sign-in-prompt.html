<div class="align-items-center d-flex flex-grow-1 justify-content-center">
  <mat-card appearance="outlined" class="sign-in-card">
    <mat-card-content class="align-items-center d-flex flex-column">
      <gf-logo class="mb-3" size="large" />

      <button
        class="sign-in-button w-100"
        color="primary"
        mat-flat-button
        (click)="openLoginDialog()"
      >
        <ng-container i18n>Sign in</ng-container>
      </button>

      @if (hasPermissionToCreateUser && hasPermissionForAuthToken) {
        <button
          class="d-inline-block mt-2"
          mat-button
          (click)="openShowAccessTokenDialog()"
        >
          <ng-container i18n>Create Account</ng-container>
        </button>
      }
    </mat-card-content>
  </mat-card>
</div>
