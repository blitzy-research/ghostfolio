<!--
  COMPONENT CONTRACT - this template requires `definition`, `resolvedComponent`,
  `hasLoadError`, `onDragHandleKeydown($event)` and `onRemove()`, and the class
  emits `move`, `resize` and `remove`; it imports IonIcon, MatButtonModule,
  MatCardModule, MatMenuModule, NgComponentOutlet and NgxSkeletonLoaderModule
  alongside CUSTOM_ELEMENTS_SCHEMA, and registers the ellipsisHorizontal,
  reorderTwoOutline and trashOutline glyphs.

  No module is named here: one is resolved at runtime and mounted into the body
  region below, so every module gets identical chrome. The module name is already
  translated where the shared metadata declares it, so it is interpolated
  verbatim, and the failure notice reuses an existing source message
  character-for-character. No string here carries a custom identifier.
-->
<mat-card
  appearance="outlined"
  role="region"
  [attr.aria-busy]="!resolvedComponent && !hasLoadError"
  [attr.aria-label]="definition?.name"
>
  <mat-card-header class="align-items-center px-3 py-2">
    <!--
      The class below and the one on the body wrapper are matched by string
      against the grid's drag configuration, so each is spelled exactly once in
      this file and nowhere else in it. Keep the handle OUTSIDE that wrapper and
      everything interactive inside it, or a press anywhere in the module starts
      a drag - a mismatch compiles and lints cleanly and then fails silently.
    -->
    <!--
      A real button, because the handle now does something when operated by
      keyboard: arrow keys move the module and Shift with an arrow resizes it,
      which is what `aria-keyshortcuts` advertises. It stays the pointer drag
      handle at the same time - the grid matches the class above by walking up
      from the pressed element, so which element carries it is irrelevant.

      `type="button"` matters here: the handle sits in no form, but the default
      submit type would still make Enter and Space do something other than
      nothing, and this control intentionally has no activation behaviour at all -
      only its arrow keys act.
    -->
    <button
      aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight Shift+ArrowUp Shift+ArrowDown Shift+ArrowLeft Shift+ArrowRight"
      aria-label="Move or resize module"
      class="gf-dashboard-module-drag-handle mr-2 p-2"
      i18n-aria-label
      i18n-title
      title="Drag to move module"
      type="button"
      (keydown)="onDragHandleKeydown($event)"
    >
      <ion-icon aria-hidden="true" name="reorder-two-outline" />
    </button>

    <!--
      Keep the title nested: direct MatCardTitle projection reorders the header,
      and overflow clipping is required for flex truncation.
    -->
    <div class="mr-2 overflow-hidden">
      <mat-card-title class="mb-0 text-truncate">{{
        definition?.name
      }}</mat-card-title>
    </div>

    <span class="gf-spacer"></span>

    <button
      aria-label="Module actions"
      i18n-aria-label
      mat-icon-button
      [matMenuTriggerFor]="moduleActionsMenu"
      (click)="$event.stopPropagation()"
    >
      <ion-icon aria-hidden="true" name="ellipsis-horizontal" />
    </button>
    <mat-menu #moduleActionsMenu="matMenu" xPosition="before">
      <button mat-menu-item (click)="onRemove()">
        <span class="align-items-center d-flex">
          <ion-icon aria-hidden="true" class="mr-2" name="trash-outline" />
          <span i18n>Remove</span>
        </span>
      </button>
    </mat-menu>
  </mat-card-header>

  <div class="gridster-item-content">
    @if (resolvedComponent) {
      <ng-container [ngComponentOutlet]="resolvedComponent" />
    } @else if (hasLoadError) {
      <div class="p-3 secondary-text text-center" i18n role="alert">
        Oops! Something went wrong.
      </div>
    } @else {
      <ngx-skeleton-loader
        animation="pulse"
        class="h-100 p-3"
        [theme]="{
          height: '100%',
          width: '100%'
        }"
      />
    }
  </div>
</mat-card>
