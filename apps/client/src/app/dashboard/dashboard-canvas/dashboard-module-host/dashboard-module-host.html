<mat-card
  appearance="outlined"
  role="region"
  [attr.aria-busy]="!resolvedComponent && !hasLoadError"
  [attr.aria-label]="definition.name"
>
  <mat-card-header class="align-items-center px-3 py-2">
    <!--
      Keep the drag handle outside .gridster-item-content: gridster matches
      these class names from its drag configuration, and a mismatch silently
      breaks drag isolation.
    -->
    <!--
      Focusable for discovery, and intentionally not a button: pointer drag has
      no keyboard activation, so the arrow keys move the module and Shift with an
      arrow key resizes it, mirroring the Move and Resize menu items below.
    -->
    <span
      aria-label="Move module: press an arrow key to move it, or Shift with an arrow key to resize it"
      class="gf-dashboard-module-drag-handle mr-2 p-2"
      i18n-aria-label
      i18n-title
      tabindex="0"
      title="Drag to move, or use the arrow keys"
      (keydown.arrowDown)="onMove('down', $event)"
      (keydown.arrowLeft)="onMove('left', $event)"
      (keydown.arrowRight)="onMove('right', $event)"
      (keydown.arrowUp)="onMove('up', $event)"
      (keydown.shift.arrowDown)="onResize('taller', $event)"
      (keydown.shift.arrowLeft)="onResize('narrower', $event)"
      (keydown.shift.arrowRight)="onResize('wider', $event)"
      (keydown.shift.arrowUp)="onResize('shorter', $event)"
    >
      <ion-icon aria-hidden="true" name="reorder-two-outline" />
    </span>

    <!--
      Keep the title nested: direct MatCardTitle projection reorders the header,
      and overflow clipping is required for flex truncation.
    -->
    <div class="mr-2 overflow-hidden">
      <mat-card-title class="mb-0 text-truncate">{{
        definition.name
      }}</mat-card-title>
    </div>

    <span class="gf-spacer"></span>

    <button
      aria-label="Module actions"
      i18n-aria-label
      mat-icon-button
      [matMenuTriggerFor]="moduleActionsMenu"
      (click)="$event.stopPropagation()"
    >
      <ion-icon aria-hidden="true" name="ellipsis-horizontal" />
    </button>
    <mat-menu #moduleActionsMenu="matMenu" xPosition="before">
      <button mat-menu-item [matMenuTriggerFor]="moduleMoveMenu">
        <span class="align-items-center d-flex">
          <ion-icon aria-hidden="true" class="mr-2" name="move-outline" />
          <span i18n>Move</span>
        </span>
      </button>
      <button mat-menu-item [matMenuTriggerFor]="moduleResizeMenu">
        <span class="align-items-center d-flex">
          <ion-icon aria-hidden="true" class="mr-2" name="resize-outline" />
          <span i18n>Resize</span>
        </span>
      </button>
      <button mat-menu-item (click)="onRemove()">
        <span class="align-items-center d-flex">
          <ion-icon aria-hidden="true" class="mr-2" name="trash-outline" />
          <span i18n>Remove</span>
        </span>
      </button>
    </mat-menu>
    <mat-menu #moduleMoveMenu="matMenu" xPosition="before">
      <button mat-menu-item (click)="onMove('up')">
        <span i18n>Move up</span>
      </button>
      <button mat-menu-item (click)="onMove('down')">
        <span i18n>Move down</span>
      </button>
      <button mat-menu-item (click)="onMove('left')">
        <span i18n>Move left</span>
      </button>
      <button mat-menu-item (click)="onMove('right')">
        <span i18n>Move right</span>
      </button>
    </mat-menu>
    <mat-menu #moduleResizeMenu="matMenu" xPosition="before">
      <button mat-menu-item (click)="onResize('wider')">
        <span i18n>Make wider</span>
      </button>
      <button mat-menu-item (click)="onResize('narrower')">
        <span i18n>Make narrower</span>
      </button>
      <button mat-menu-item (click)="onResize('taller')">
        <span i18n>Make taller</span>
      </button>
      <button mat-menu-item (click)="onResize('shorter')">
        <span i18n>Make shorter</span>
      </button>
    </mat-menu>
  </mat-card-header>

  <div class="gridster-item-content">
    @if (resolvedComponent) {
      <ng-container [ngComponentOutlet]="resolvedComponent" />
    } @else if (hasLoadError) {
      <div class="p-3 secondary-text text-center" i18n role="alert">
        Oops! Something went wrong.
      </div>
    } @else {
      <ngx-skeleton-loader
        animation="pulse"
        class="h-100 p-3"
        [theme]="{
          height: '100%',
          width: '100%'
        }"
      />
    }
  </div>
</mat-card>
