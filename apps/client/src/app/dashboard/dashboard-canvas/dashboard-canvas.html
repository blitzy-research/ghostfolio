<!--
  COMPONENT CONTRACT - this template requires the four state members
  `isPublicPortfolio`, `isSignedOut`, `isInitialized` and `isCatalogOpen`, the
  grid members `options`, `modules` and `getModuleDefinition()`, and the handlers
  `onAddModule()`, `onCatalogOpenedChange()`, `onOpenCatalog()`,
  `onRemoveModule()` and `onToggleCatalog()`. It imports Gridster, GridsterItem,
  GfDashboardModuleHostComponent, GfDashboardToolbarComponent,
  GfEmptyCanvasStateComponent, GfModuleCatalogComponent,
  GfPublicPortfolioComponent, GfSignInPromptComponent, IonIcon, MatButtonModule
  and MatSidenavModule alongside CUSTOM_ELEMENTS_SCHEMA, and registers exactly
  two glyphs: addOutline and closeOutline.

  Three obligations of that contract are load-bearing rather than stylistic:

  - `options` must already hold the configuration minted by
    `createDashboardCanvasConfig()` before this template first renders, because
    `options` is a *required signal input* on `gridster` and the grid reads it
    during its own initialisation. Assign it in a field initialiser or the
    constructor, never in `ngOnInit`.
  - `modules` must be a `DashboardLayoutItem[]` that starts as an empty array,
    because the repeater below iterates it directly and the empty branch is
    decided from its length. Both readings are written to survive a null anyway -
    the repeater treats one as empty and the length is reached optionally - so a
    contract slip degrades to the empty notice instead of faulting the canvas.
  - `getModuleDefinition()` must hand back the registry's own definition object
    for a module type - the *same reference* on every call. The host it feeds
    resolves the lazy module class per definition identity, so returning a fresh
    object would re-resolve, and re-mount, every module on every
    change-detection pass.

  Four states, evaluated top to bottom, and the order is part of the behaviour.
  The shared-portfolio state is tested first so a link handed to a stranger wins
  over whatever the viewer's own session would otherwise draw, and the paint of
  the signed-in canvas is held behind `isInitialized` so no state is shown
  speculatively - which is also what keeps the catalog from flickering open for a
  returning user before their saved arrangement has arrived.

  Nothing here addresses a screen. There is no in-application link, no route
  markup and no outlet: the router still owns the one root route, and it mounts
  this canvas rather than the canvas mounting it. No cell coordinate and no cell
  size is written by this file either - `[item]` on `gridster-item` is the single
  carrier of geometry, and the grid mutates those objects in place.

  Two pieces of markup are deliberately absent, and both would be actively
  harmful. The resize affordances and the drop preview are rendered by the grid
  itself and are only ever *styled*, by the global partial, so authoring an
  element for either would duplicate library-owned chrome. And the drag handle
  belongs to the module host, which is what keeps it outside the content wrapper
  the grid is told to ignore; a second handle here would sit outside every card
  it was meant to move.
-->
@if (isPublicPortfolio) {
  <!--
    A portfolio shared by access link, and the whole viewport while it is shown:
    no control bar, no grid, no catalog and no trigger, because none of them acts
    on someone else's portfolio. The component takes no bindings at all - it
    reads the access id straight from the query parameters it was addressed with,
    which is also why stripping an unrelated parameter from the same URL cannot
    disturb it.

    The two wrappers each do one job that the component cannot do for itself.
    Relocating it out of its former page left its rows without the page's own
    container, and a Bootstrap row without one bleeds past the viewport on its
    negative margins, so the inner element restores exactly that container. The
    outer element is the scroll region: the host clips its overflow to keep the
    grid's own scrolling contained, so this branch has to bring a scroller of its
    own, and declaring the overflow is what additionally lets it shrink to the
    height available instead of pushing the shell past one viewport.
  -->
  <div class="flex-grow-1 overflow-auto">
    <div class="container">
      <gf-public-portfolio />
    </div>
  </div>
} @else if (isSignedOut) {
  <!--
    Signed out, and no shared link to honour. Only the prompt is drawn: the
    public surface this application used to greet an unauthenticated visitor with
    no longer exists, so there is nothing else here to show and nothing is
    invented to fill it. The prompt declares its own column and centres itself
    inside the height the stylesheet gives it.
  -->
  <gf-sign-in-prompt />
} @else if (isInitialized) {
  <!--
    The control bar sits outside the drawer container on purpose. It spans the
    full width and the container takes the height left beneath it, so the catalog
    opens below the bar rather than across it, and the bar stays put while the
    canvas beneath it scrolls.
  -->
  <gf-dashboard-toolbar />

  <mat-sidenav-container>
    <!--
      `mode="side"` is not a preference. An `over` or `push` drawer lays a
      backdrop over the container, and that backdrop swallows the browser's own
      `dragover` and `drop` events - the very events the grid listens for - so
      dragging a row out of the catalog would quietly stop adding anything.
      `position="end"` keeps the panel on the trailing edge. Neither may change.

      The open state is owned here rather than by the catalog, which renders no
      drawer of its own. It is bound in both directions on purpose: the library
      closes a drawer on Escape, and a viewer dismissing the panel that way would
      otherwise leave this flag - and with it the trigger's glyph - claiming the
      panel was still open.
    -->
    <mat-sidenav
      id="gfDashboardModuleCatalog"
      mode="side"
      position="end"
      [opened]="isCatalogOpen"
      (openedChange)="onCatalogOpenedChange($event)"
    >
      <gf-module-catalog (moduleAdded)="onAddModule($event)" />
    </mat-sidenav>

    <mat-sidenav-content>
      <!--
        Shown whenever there is nothing placed - a viewer who has never saved an
        arrangement, one whose saved arrangement was empty, and one whose saved
        arrangement named only module types the registry no longer knows all
        reach the same notice. The grid stays mounted underneath it rather than
        being swapped out, so the drop target a dragged catalog row needs exists
        on a canvas that is still empty, which is precisely when it is most
        likely to be used.
      -->
      @if (!modules?.length) {
        <gf-empty-canvas-state class="p-3" (openCatalog)="onOpenCatalog()" />
      }

      <gridster [options]="options">
        <!--
          Tracked by module type: it is unique across the registry and stable for
          the life of a placement, so each cell keeps its element - and with it
          the module already resolved into that element - while its neighbours
          are added, moved or removed. Tracking by index would instead re-key
          every cell after the removed one and re-resolve their modules.

          The grid's change, resize, init and remove callbacks are declared once,
          in the grid configuration, and are the complete set of triggers that
          save an arrangement. Repeating any of them as an output binding here
          would add a fifth.
        -->
        @for (item of modules; track item.moduleType) {
          <gridster-item [item]="item">
            <!--
              The one place a module reaches the canvas, and it arrives as
              metadata rather than as a class: the host awaits the lazy loader on
              the definition and mounts whatever it resolves to. Nothing about
              where or how large the cell is passes through here - the grid item
              above already carries all of it - and removal only reports itself,
              leaving the arrangement and the write that follows it to the canvas.
            -->
            <gf-dashboard-module-host
              [definition]="getModuleDefinition(item.moduleType)"
              (remove)="onRemoveModule(item)"
            />
          </gridster-item>
        }
      </gridster>
    </mat-sidenav-content>
  </mat-sidenav-container>

  <!--
    The only genuinely floating control on the canvas, and the only way back to
    the catalog once an arrangement exists. It carries its own global class
    instead of the wrapper the feature leaves use: every one of those leaves is
    now mounted at once, so sharing their class would stack this trigger on top
    of theirs at the same coordinate.

    It is a disclosure control, so it is named once and reports its state rather
    than renaming itself: the wording is reused character for character from the
    catalog's own empty-state action, which keeps both on a single translation.
    The glyph does the visual half of the same job, and the mark itself is hidden
    from assistive technology because the button is already named.
  -->
  <div class="gf-dashboard-catalog-trigger">
    <button
      aria-controls="gfDashboardModuleCatalog"
      aria-label="Browse modules"
      color="primary"
      i18n-aria-label
      i18n-title
      mat-fab
      title="Browse modules"
      type="button"
      [attr.aria-expanded]="isCatalogOpen"
      (click)="onToggleCatalog()"
    >
      <ion-icon
        aria-hidden="true"
        size="large"
        [name]="isCatalogOpen ? 'close-outline' : 'add-outline'"
      />
    </button>
  </div>
}
