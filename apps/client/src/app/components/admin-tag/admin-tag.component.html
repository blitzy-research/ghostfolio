<div class="d-flex justify-content-end">
  <a
    color="primary"
    i18n
    mat-flat-button
    queryParamsHandling="merge"
    [queryParams]="createDialogQueryParams"
    [routerLink]="[]"
  >
    Add Tag
  </a>
</div>
<table
  class="gf-table w-100"
  mat-table
  matSort
  matSortActive="name"
  matSortDirection="asc"
  [dataSource]="dataSource"
>
  <ng-container matColumnDef="name">
    <th
      *matHeaderCellDef
      class="px-1"
      mat-header-cell
      mat-sort-header="name"
      scope="col"
    >
      <ng-container i18n>Name</ng-container>
    </th>
    <td *matCellDef="let element" class="px-1" mat-cell>
      {{ element.name }}
    </td>
  </ng-container>

  <ng-container matColumnDef="userId">
    <th
      *matHeaderCellDef
      class="px-1"
      mat-header-cell
      mat-sort-header="userId"
      scope="col"
    >
      <ng-container i18n>User</ng-container>
    </th>
    <td *matCellDef="let element" class="px-1" mat-cell>
      <span class="text-monospace">{{ element.userId }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="activities">
    <th
      *matHeaderCellDef
      class="justify-content-end px-1"
      mat-header-cell
      mat-sort-header="activityCount"
      scope="col"
    >
      <ng-container i18n>Activities</ng-container>
    </th>
    <td *matCellDef="let element" class="px-1 text-right" mat-cell>
      <gf-value
        class="d-inline-block justify-content-end"
        [locale]="locale"
        [value]="element.activityCount"
      />
    </td>
  </ng-container>

  <ng-container matColumnDef="actions" stickyEnd>
    <th *matHeaderCellDef class="px-1 text-center" mat-header-cell scope="col">
      <span class="sr-only" i18n>Actions</span>
    </th>
    <td *matCellDef="let element" class="px-1 text-center" mat-cell>
      <button
        aria-label="Actions for this tag"
        class="mx-1 no-min-width px-2"
        i18n-aria-label
        mat-button
        [matMenuTriggerFor]="tagMenu"
        (click)="$event.stopPropagation()"
      >
        <ion-icon aria-hidden="true" name="ellipsis-horizontal" />
      </button>
      <mat-menu #tagMenu="matMenu" xPosition="before">
        <button mat-menu-item (click)="onUpdateTag(element)">
          <span class="align-items-center d-flex">
            <ion-icon aria-hidden="true" class="mr-2" name="create-outline" />
            <span><ng-container i18n>Edit</ng-container>...</span>
          </span>
        </button>
        <hr class="m-0" />
        <button
          mat-menu-item
          [disabled]="element.activityCount > 0"
          (click)="onDeleteTag(element.id)"
        >
          <span class="align-items-center d-flex">
            <ion-icon aria-hidden="true" class="mr-2" name="trash-outline" />
            <span i18n>Delete</span>
          </span>
        </button>
      </mat-menu>
    </td>
  </ng-container>

  <tr *matHeaderRowDef="displayedColumns; sticky: true" mat-header-row></tr>
  <tr *matRowDef="let row; columns: displayedColumns" mat-row></tr>
</table>
