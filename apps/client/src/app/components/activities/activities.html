<!--
  `createActivityClicked` is raised by the empty-state indicator the table
  renders while a viewer has no activities yet, and is forwarded by the table
  because that indicator lives in the component library and may not address the
  application. Leaving it unbound is what left the invitation doing nothing at
  all, so the binding below is load-bearing rather than decorative.
-->
<div class="mb-3 row">
  <div class="col">
    <gf-activities-table
      [baseCurrency]="user?.settings?.baseCurrency"
      [dataSource]="dataSource"
      [deviceType]="deviceType"
      [hasActivities]="user?.activitiesCount > 0"
      [hasPermissionToCreateActivity]="hasPermissionToCreateActivity"
      [hasPermissionToDeleteActivity]="hasPermissionToDeleteActivity"
      [hasPermissionToExportActivities]="!hasImpersonationId"
      [hasPermissionToFilterByType]="user?.settings?.isExperimentalFeatures"
      [locale]="user?.settings?.locale"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [showActions]="
        !hasImpersonationId &&
        hasPermissionToDeleteActivity &&
        !user.settings.isRestrictedView
      "
      [sortColumn]="sortColumn"
      [sortDirection]="sortDirection"
      [totalItems]="totalItems"
      (activitiesDeleted)="onDeleteActivities()"
      (activityClicked)="onClickActivity($event)"
      (activityDeleted)="onDeleteActivity($event)"
      (activityToClone)="onCloneActivity($event)"
      (activityToUpdate)="onUpdateActivity($event)"
      (createActivityClicked)="onCreateActivity()"
      (export)="onExport()"
      (exportDrafts)="onExportDrafts($event)"
      (import)="onImport()"
      (importDividends)="onImportDividends()"
      (pageChanged)="onChangePage($event)"
      (sortChanged)="onSortChanged($event)"
      (typesFilterChanged)="onTypesFilterChanged($event)"
    />
  </div>
</div>

@if (
  !hasImpersonationId &&
  hasPermissionToCreateActivity &&
  !user.settings.isRestrictedView
) {
  <div class="fab-container">
    <!--
      An icon-only control, so its accessible name has to come from an attribute.
      The label is the title of the dialog this control opens, which is an already
      translated source message - the name a screen reader announces therefore
      matches the dialog that appears. The glyph is decorative and hidden so it
      cannot be announced a second time.
    -->
    <a
      aria-label="Add activity"
      class="align-items-center d-flex justify-content-center"
      color="primary"
      i18n-aria-label
      i18n-title
      mat-fab
      queryParamsHandling="merge"
      title="Add activity"
      [queryParams]="createDialogQueryParams"
      [routerLink]="[]"
    >
      <ion-icon aria-hidden="true" name="add-outline" size="large" />
    </a>
  </div>
}
