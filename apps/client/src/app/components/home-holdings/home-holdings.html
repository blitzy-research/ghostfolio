<!--
  A module-scale container, not a page-scale one. `container-fluid` keeps the
  horizontal gutter that cancels the negative margins of the rows below - without
  it they bleed past their cell - while dropping the responsive max-width that
  made this content read as a page nested inside a grid cell.
-->
<div class="container-fluid">
  <!--
    The page heading that stood here is gone: the module chrome around this
    content already carries "Holdings" as its title, so keeping it would name the
    module twice on screen and put a second level-one heading inside a dashboard
    that already has one. Every heading below is a section heading and stays.
  -->
  <div class="row">
    <div class="col-lg">
      <div class="d-flex">
        <div class="d-flex">
          <div class="d-none d-lg-block">
            <mat-button-toggle-group
              [formControl]="viewModeFormControl"
              [hideSingleSelectionIndicator]="true"
            >
              <!--
                `aria-label` is required here in addition to `title`, and the two
                are not redundant. `title` lands on this `mat-button-toggle` host,
                but the focusable control is the `<button>` Material renders
                INSIDE it, which inherits nothing from the host and was therefore
                nameless. `aria-label` is a declared input on this component and
                is forwarded onto that inner button, which is the only way to name
                it without touching the library.
              -->
              <mat-button-toggle
                aria-label="Show holdings as a table"
                i18n-aria-label
                i18n-title
                title="Table"
                value="TABLE"
              >
                <ion-icon aria-hidden="true" name="reorder-four-outline" />
              </mat-button-toggle>
              <mat-button-toggle
                aria-label="Show holdings as a chart"
                i18n-aria-label
                i18n-title
                title="Chart"
                value="CHART"
              >
                <ion-icon aria-hidden="true" name="grid-outline" />
              </mat-button-toggle>
            </mat-button-toggle-group>
          </div>
        </div>
        <div class="align-items-center d-flex flex-grow-1 justify-content-end">
          <gf-toggle
            class="d-none d-lg-block"
            [defaultValue]="holdingType"
            [isLoading]="false"
            [options]="holdingTypeOptions"
            (valueChange)="onChangeHoldingType($event.value)"
          />
        </div>
      </div>
      @if (viewModeFormControl.value === 'CHART') {
        <gf-treemap-chart
          class="mt-3"
          cursor="pointer"
          [baseCurrency]="user?.settings?.baseCurrency"
          [colorScheme]="user?.settings?.colorScheme"
          [dateRange]="user?.settings?.dateRange"
          [holdings]="holdings"
          [locale]="user?.settings?.locale"
          (treemapChartClicked)="onHoldingClicked($event)"
        />
      }
      <div [ngClass]="{ 'd-none': viewModeFormControl.value !== 'TABLE' }">
        <gf-holdings-table
          [holdings]="holdings"
          [locale]="user?.settings?.locale"
          (holdingClicked)="onHoldingClicked($event)"
        />
        @if (
          !hasImpersonationId &&
          hasPermissionToCreateActivity &&
          holdings?.length > 0
        ) {
          <div class="text-center">
            <!--
              A button, not an anchor: this control publishes a reveal-module
              intent on the canvas rather than navigating to a URL, so it has no
              href to offer. As a real button it is reachable by keyboard,
              announced as a button, and activates on both Enter and Space.
            -->
            <button
              class="mt-3"
              mat-stroked-button
              type="button"
              (click)="onManageActivities()"
            >
              <!--
                The `i18n` marker hugs the label on an inner `ng-container`: this
                tag carries too many attributes to keep its content inline, and
                Angular folds the surrounding whitespace of a marked element into
                the message it hashes into an id. Hugging the label keeps the id
                the anchor this button replaced already had, and with it the
                twelve existing translations.
              -->
              <ng-container i18n>Manage Activities</ng-container>
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</div>
