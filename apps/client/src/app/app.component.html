<!--
  The banner element is conditional, not merely its contents. `<header>` carries
  the implicit `banner` role, so leaving it in place while it holds nothing
  publishes an empty landmark: assistive technology offers it in its landmark list
  and lands the reader on nothing. The condition is the one the host class is
  derived from, so the element and the styling that sizes it appear together.
-->
@if (hasInfoMessage) {
  <header>
    <div class="info-message-container">
      <div class="info-message-inner-container position-fixed w-100">
        <div class="align-items-center d-flex h-100 justify-content-center">
          @if (canCreateAccount) {
            <div class="text-center">
              <button
                class="cursor-pointer d-inline-block info-message"
                type="button"
                (click)="onCreateAccount()"
              >
                <span i18n>You are using the Live Demo.</span>
                <span class="a ml-2 p-1" i18n>Create Account</span>
              </button>
            </div>
          }
          @if (!canCreateAccount && user?.systemMessage) {
            <div
              class="cursor-pointer d-inline-block info-message text-truncate"
              (click)="onClickSystemMessage()"
            >
              {{ user.systemMessage.message }}
            </div>
          }
        </div>
      </div>
    </div>
  </header>
}

<main role="main">
  <router-outlet />
</main>
