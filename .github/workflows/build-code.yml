name: Build code

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_version:
          - 22.22.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code style
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Type-checks the spec sources themselves. Jest transpiles each spec in
      # isolation and the production builds exclude specs altogether, so without
      # this step a type error inside a test can sit in the repository while the
      # test run and the build both stay green.
      - name: Check test types
        run: npm run typecheck:tests

      - name: Execute tests
        run: npm test

      - name: Build application
        run: npm run build:production
